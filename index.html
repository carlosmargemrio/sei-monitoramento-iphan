<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Painel de monitoramento de múltiplos processos públicos do SEI/IPHAN.">
  <title>Monitor SEI/IPHAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Monitor SEI/IPHAN">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>
          <strong>Monitor SEI/IPHAN</strong>
          <small>Acompanhamento automatizado de processos</small>
        </span>
      </a>
      <div class="status-pill neutral" id="global-status">
        <span class="status-dot"></span>
        <span>Carregando estado…</span>
      </div>
    </header>

    <main id="app" aria-live="polite">
      <section class="loading-panel">
        <div class="spinner" aria-hidden="true"></div>
        <p>Carregando dados do monitor…</p>
      </section>
    </main>

    <footer>
      <span>Monitoramento automatizado • GitHub Actions + GitHub Pages</span>
      <span>Somente dados disponibilizados publicamente na Pesquisa Processual.</span>
    </footer>
  </div>
  <script src="js/app.js" defer></script>
</body>
</html>
